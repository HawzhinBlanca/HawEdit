[project]
name = "hawedit"
version = "0.1.0"
description = "Kurdish (Sorani/ckb) video repurposing system — implements BLUEPRINT.md v1.1"
requires-python = ">=3.11"
# Licences audited in DECISIONS.md D-002. NonCommercial licences are a hard reject.
dependencies = [
    "klpt==0.1.7",      # CC BY-SA 4.0 — attribution required, share-alike on adaptation
    "fonttools==4.55.3", # MIT — §4.3.4 font coverage assertion
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4", # MIT
    "ruff==0.9.6",   # MIT
    "mypy==1.15.0",  # MIT
]
# §3 Stage 0's media stack. Split out because torch is ~2 GB and nothing outside Stage 0
# needs it — the §4.1/§4.2/§4.3/§8.1 work is pure Python and stays installable in seconds.
# Licences audited in DECISIONS.md D-024; NonCommercial is a hard reject and none of these
# are. Both models are named in §7: PySceneDetect for shot detection, Silero VAD for speech.
media = [
    "scenedetect==0.6.5",   # BSD-3-Clause — §7 shot detection
    # scenedetect declares OpenCV as an *optional* extra, so `import scenedetect`
    # succeeds on an install that cannot detect a single cut. CI caught that; a local
    # venv that happened to have it did not. Headless on purpose: §6 puts Stage 0 on a
    # server, and the GUI build pulls X11 libraries no runner or render box needs.
    # OpenCV 5 removed CascadeClassifier, which Stage 6's built-in face tracker uses.
    "opencv-python-headless==4.12.0.88", # Apache-2.0 — scene + face detection backend
    "silero-vad==5.1.2",    # MIT — §7 VAD; ships its own ONNX weights in the wheel
    "onnxruntime==1.20.1",  # MIT — silero-vad's ONNX backend
    "torch==2.13.0",        # BSD-3-Clause — silero-vad's tensor interface
    "numpy==2.2.1",         # BSD-3-Clause — WAV frames to tensor without torchaudio
]
# §3 Stages 2, 3 Path B and 5 — the models that need a GPU. Split from `media` because Stage 0
# runs on CPU by design (§6) and nothing in §4.1/§4.2/§4.3/§8.1 needs any of this.
#
# The CUDA build of torch is NOT expressible here: it lives on a separate index and its version
# carries a local segment. Install it first, then this extra:
#
#   pip install --index-url https://download.pytorch.org/whl/cu130 \
#     --extra-index-url https://pypi.org/simple "torch==2.13.0+cu130" "torchvision==0.28.0+cu130"
#   pip install -e '.[dev,media,gpu]'
#
# `torch==2.13.0+cu130` and not `torch==2.13.0`: the CPU wheel already installed *is* 2.13.0, so
# pip reports success and changes nothing, leaving `cuda.is_available()` False after a green
# install. PEP 440 makes `==2.13.0` above match any local version, so the pin still holds.
# cu130 is also the only channel with torch 2.13.0 for cp311/Windows. See evidence/gpu-stack.md.
#
# Licences audited per D-002; NonCommercial is a hard reject and none of these are.
gpu = [
    # PINNED, not a floor. Every §7 visual checkpoint declares 4.57.x in its own config —
    # Qwen3-VL-Embedding 4.57.1, Qwen3-VL-Reranker 4.57.0, TimeLens2 4.57.3,
    # VideoChat3 4.57.0.dev0 — and 5.x breaks VideoChat3 three ways, one of them silently
    # (a randomly-initialised lm_head). It also *moves the numbers*: the reranker's scores on
    # the fixture are 0.448/0.443/0.400 on 5.14.1 and 0.056/0.050/0.023 on 4.57.6, and the
    # final order differs. §8.1's rule that a number carries the hardware it was measured on
    # extends to the library that produced it. See D-055.
    "transformers==4.57.6",         # Apache-2.0
    "accelerate>=1.0",              # Apache-2.0 — device placement for the 4B models
    "pillow>=10",                   # MIT-CMU (HPND) — frames between ffmpeg and the processor
    "torchvision>=0.28",            # BSD-3-Clause — required by Qwen3VLVideoProcessor
]
asr = [
    # fairseq2n has no Windows wheel. The Windows runner invokes this extra inside WSL2.
    "omnilingual-asr==0.2.0; platform_system != 'Windows'", # Apache-2.0
]
cloud = [
    "google-auth>=2.40,<3", # Apache-2.0 — Vertex ADC bearer authentication
]
# AGENT_ARCHITECTURE_DEFINITIVE_2026-08-11.md Phase 1: the coarse durable workflow around
# run_pipeline (D-A3). MIT. Pulls in psycopg (Postgres, unused until a later phase),
# sqlalchemy and click — all already-audited-elsewhere licences, no NC.
agentic = [
    "dbos==2.29.0",
    # Phase 2 (D-A5). MIT. Bare package, no provider extra: build_agent() takes an
    # already-constructed Model, so this module never chooses or wires a provider itself —
    # see agent.py's module docstring for why the model choice is deferred, not this
    # dependency's business. Adding a provider extra (e.g. `[google]`) pulls in google-genai +
    # google-auth, which broke `mypy --strict` locally the moment it was actually installed
    # (google-auth's own `Credentials.refresh` has no type annotation, and the existing
    # `google.*` mypy override only suppresses *missing*-import errors, not real ones against
    # an installed package) — confirmed by installing it, hitting the error, and removing it
    # again rather than guessing whether it was needed.
    "pydantic-ai-slim==2.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/hawedit/assets/fonts" = [
    "assets/fonts/NotoNaskhArabic-Regular.ttf",
    "assets/fonts/OFL.txt",
]
"share/hawedit/models" = ["models/sources.json", "models/revisions.json"]

[project.scripts]
hawedit = "hawedit.pipeline:main"
hawedit-asr-bench = "hawedit.bench:main"
hawedit-asr-setup = "hawedit.wsl_setup:main"
hawedit-credentials = "hawedit.credentials:main"
hawedit-editorial-bench = "hawedit.editorial_bench:main"
hawedit-durable = "hawedit.durable:main"
hawedit-revise = "hawedit.proposals:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Kurdish text in assertion diffs is unreadable when truncated.
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3 flag characters confusable with ASCII. They buy this project nothing: the
# collisions that actually matter here are Arabic-script-internal (Arabic ي vs Farsi ی,
# ه+ZWNJ vs ە), which look nothing like ASCII and are handled by §4.1 normalization and
# asserted in tests/test_normalize.py. What the rules do fire on is every § and en dash
# quoted verbatim from BLUEPRINT.md, and every Kurdish test fixture. Silencing them is not
# a loss of coverage — see DECISIONS.md D-007.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
# Must stay equal to verify.sh's LINT_CMD/FORMAT_CMD path list; tests/test_gate.py asserts it
# both ways, and that every .py file in the repository falls under one of these roots. D-161.
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
  "klpt.*",
  "fontTools.*",
  "scenedetect.*",
  "silero_vad.*",
  "torch.*",
  "google.*",
  "omnilingual_asr.*",
  "fairseq2.*",
  # `peft`, like the two above, lives only in the WSL2 runtime `hawedit-asr-setup` provisions —
  # never in the Windows or CI environment. `--omni-asr-adapter` imports it inside a function
  # behind `try: ... except ImportError`, which is what makes it optional at runtime; this says
  # the same thing to the type checker. D-181.
  "peft.*",
  # The `gpu` extra. CI installs `.[dev,media]` only — §6 puts Stage 0 on CPU and the CUDA
  # build of torch is ~2 GB of runner disk for kernels nothing in the gate calls — so these
  # resolve on hawapc01 and not on a clean runner. Every import of them is already inside a
  # function behind `try: ... except ImportError`, which is what makes them optional at
  # runtime; this is the same statement to the type checker. Added after `mypy --strict`
  # passed here and failed on the runner for four of my own lines (D-067).
  "transformers.*",
  "PIL.*",
  # The `agentic` extra (D-A3). `dbos` ships its own inline type hints (no `-stubs` package
  # needed to resolve names) but declaring it here is what lets `durable.py` import it at
  # module level — required for `@DBOS.workflow()`/`@DBOS.step()` to decorate module-level
  # functions — without every environment that runs `mypy --strict` having it installed.
  # Unlike `transformers`/`PIL` above, CI's lockfile *does* install it (`requirements/
  # gate-linux-py311.txt` was regenerated with `--extra agentic`), so this override is for the
  # environments that lockfile does not cover: a bare `pip install -e .` with no extras.
  "dbos.*",
]
ignore_missing_imports = true
