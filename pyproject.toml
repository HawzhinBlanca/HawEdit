[project]
name = "hawedit2"
version = "0.1.0"
description = "Kurdish (Sorani/ckb) video repurposing system — implements BLUEPRINT.md v1.1"
requires-python = ">=3.11"
# Licences audited in DECISIONS.md D-002. NonCommercial licences are a hard reject.
dependencies = [
    "klpt==0.1.7", # CC BY-SA 4.0 — attribution required, share-alike on adaptation
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4", # MIT
    "ruff==0.9.6",   # MIT
    "mypy==1.15.0",  # MIT
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Kurdish text in assertion diffs is unreadable when truncated.
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Kurdish/Arabic-script string literals trip RUF001/RUF002/RUF003 (ambiguous unicode) by
# design — that ambiguity is exactly what §4.1 normalization exists to resolve, and the
# test corpus must contain the confusable characters verbatim.
"tests/*" = ["RUF001", "RUF002", "RUF003"]
"src/hawedit2/normalize.py" = ["RUF001", "RUF002", "RUF003"]
# Quotes BLUEPRINT §7 prose verbatim (§, en dashes) so entries stay traceable to the source.
"src/hawedit2/registry.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["klpt.*"]
ignore_missing_imports = true
