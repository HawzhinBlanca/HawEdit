name: gpu-readiness

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: hawedit-gpu-readiness
  cancel-in-progress: false

jobs:
  verify-measured-host:
    runs-on: [self-hosted, Windows, X64, hawedit-gpu]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use the measured Python minor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the exact CUDA graph and prove both cards
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/hawedit-gpu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m venv "$venv"
          bash scripts/install-host.sh "$venv/Scripts/python.exe" gpu
